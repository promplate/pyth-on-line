name: code review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  id-token: write

concurrency:
  group: code-review-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  queue: max

jobs:
  review:
    if: >
      github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      || (github.event.issue.pull_request != null && github.event.issue.state == 'open')
      || (github.event.pull_request.state == 'open' && github.event.pull_request.head.repo.full_name == github.repository
          && (github.event.action != 'ready_for_review' || github.event.pull_request.user.type == 'Bot'))
    runs-on: ubuntu-latest
    steps:
      - uses: promplate/code-review@main
        with:
          codex-config: ${{ secrets.CODEX_CONFIG }}
          codex-auth: ${{ secrets.CODEX_AUTH }}

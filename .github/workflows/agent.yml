name: agent invoke

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  issues:
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  id-token: write

concurrency:
  group: code-review-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  queue: max

jobs:
  agent:
    cache-mode: write
    runs-on: ubuntu-latest
    steps:
      - uses: promplate/code-review@main
        with:
          codex-config: ${{ secrets.CODEX_CONFIG }}
          codex-auth: ${{ secrets.CODEX_AUTH }}

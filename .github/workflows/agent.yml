name: agent invoke

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  issues:
    # A labeled issue wakes the agent, which decides how to respond rather than reviewing anything.
    types: [labeled]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  id-token: write

concurrency:
  group: code-review-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  queue: max

jobs:
  agent:
    # Pull request discussion continues after it closes, and a merge or close is context the agent can act on;
    # ordinary issues only wake it while open.
    if: >
      github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      || github.event.issue.pull_request != null
      || (github.event.issue.pull_request == null && github.event.issue.state == 'open')
      || (github.event.pull_request.head.repo.full_name == github.repository
          && (github.event.action == 'closed'
              || (github.event.pull_request.state == 'open'
                  && (github.event.action != 'ready_for_review' || github.event.pull_request.user.type == 'Bot'))))
    cache-mode: write
    runs-on: ubuntu-latest
    steps:
      - uses: promplate/code-review@main
        with:
          codex-config: ${{ secrets.CODEX_CONFIG }}
          codex-auth: ${{ secrets.CODEX_AUTH }}
